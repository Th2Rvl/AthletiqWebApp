<button
  type="button"
  class="chip"
  [class.chip--locked]="locked()"
  [attr.aria-label]="ariaLabel()"
  (click)="selected.emit()"
>
  <span class="chip__name">{{ name() }}</span>
  <span class="chip__meta">
    <span class="chip__state">{{ locked() ? 'Passée' : 'Planifiée' }}</span>
    @if (meta(); as text) {
      <span>· {{ text }}</span>
    }
  </span>
</button>
