<button
  type="button"
  class="chip"
  [class.chip--locked]="locked()"
  [attr.aria-label]="ariaLabel()"
  (click)="selected.emit()"
>
  <span class="chip__name">{{ name() }}</span>
  <span class="chip__meta">
    <span
      class="chip__state"
      [class.chip__state--done]="status() === 'DONE'"
      [class.chip__state--missed]="status() === 'MISSED'"
      >{{ state() }}</span
    >
    @if (meta(); as text) {
      <span>· {{ text }}</span>
    }
  </span>
</button>
