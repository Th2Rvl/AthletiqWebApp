<div class="profile">
  <app-page-header title="Mon profil" />

  @if (loading()) {
    <div class="profile__skeleton" aria-busy="true" aria-label="Chargement du profil">
      <p-skeleton width="16rem" height="3rem" />
      <p-skeleton width="100%" height="2.5rem" />
      <p-skeleton width="100%" height="2.5rem" />
    </div>
  } @else if (profile(); as current) {
    <dl class="profile__summary">
      <div class="profile__summary-item">
        <dt>Rôle</dt>
        <dd>{{ current.role === 'COACH' ? 'Coach' : 'Administrateur' }}</dd>
      </div>
      <div class="profile__summary-item">
        <dt>Compte créé le</dt>
        <dd>{{ current.createdAt.slice(0, 10) }}</dd>
      </div>
    </dl>

    @if (success(); as text) {
      <p-message severity="success" role="status">{{ text }}</p-message>
    }

    <app-profile-form
      [profile]="current"
      [submitting]="submitting()"
      [error]="error()"
      (submitted)="save($event)"
    />
  } @else {
    <app-error-state [message]="error() ?? ''" (retry)="reload()" />
  }
</div>
