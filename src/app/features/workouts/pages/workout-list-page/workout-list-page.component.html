<app-page-header title="Séances">
  <button pButton type="button" (click)="openCreate()">
    <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
    Créer une séance
  </button>
</app-page-header>

@if (workouts.error() && !workouts.loading()) {
  <app-error-state [message]="errorMessage()" (retry)="workouts.reload()" />
} @else {
  <app-workout-table
    [workouts]="workouts.items()"
    [totalRecords]="workouts.total()"
    [loading]="workouts.loading()"
    [loaded]="workouts.loaded()"
    [first]="workouts.first()"
    [rows]="workouts.rows()"
    [query]="query()"
    [duplicatingId]="duplicatingId()"
    (pageChange)="onPage($event)"
    (queryChange)="onQueryChange($event)"
    (create)="openCreate()"
    (edit)="openEdit($event)"
    (duplicate)="duplicate($event)"
    (remove)="confirmRemove($event)"
  />
}
