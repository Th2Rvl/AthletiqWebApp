@if (notFound() || loadError() || loading()) {
  <app-page-header [title]="heading()">
    <span pageHeaderContext class="breadcrumb">
      <a routerLink="/seances">Séances</a> / {{ isNew() ? 'Nouvelle' : 'Modifier' }}
    </span>
  </app-page-header>
}

@if (notFound()) {
  <app-empty-state
    message="Cette séance n'existe plus"
    detail="Elle a peut-être été supprimée, ou le lien est incorrect."
    actionLabel="Retour aux séances"
    (action)="backToList()"
  />
} @else if (loadError()) {
  <app-error-state [message]="loadErrorMessage()" (retry)="load()" />
} @else if (loading()) {
  <div class="editor-skeleton" aria-busy="true" aria-label="Chargement de la séance">
    <p-skeleton width="100%" height="4rem" />
    <p-skeleton width="100%" height="12rem" />
    <p-skeleton width="100%" height="12rem" />
  </div>
} @else {
  <app-workout-editor
    [workout]="workout()"
    [heading]="heading()"
    [isNew]="isNew()"
    [duplicating]="duplicating()"
    [libraryEmpty]="libraryEmpty()"
    [saving]="saving()"
    [serverErrors]="serverErrors()"
    (submitted)="save($event)"
    (cancelled)="backToList()"
    (addRequested)="openPicker()"
    (duplicate)="duplicate()"
    (remove)="confirmRemove()"
  />
}

<p-dialog
  header="Ajouter des exercices"
  [visible]="pickerVisible()"
  (visibleChange)="pickerVisible.set($event)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: 'min(40rem, 100vw)' }"
>
  @if (pickerVisible()) {
    <app-exercise-picker
      [exercises]="pickerExercises()"
      [totalRecords]="pickerTotal()"
      [loaded]="pickerLoaded()"
      [loading]="pickerLoading()"
      [errorMessage]="pickerErrorMessage()"
      [query]="pickerQuery()"
      [muscleGroup]="pickerMuscleGroup()"
      [remaining]="pickerRemaining()"
      (queryChange)="onPickerQuery($event)"
      (muscleGroupChange)="onPickerMuscleGroup($event)"
      (picked)="addExercises($event)"
      (cancelled)="pickerVisible.set(false)"
      (retry)="loadPicker()"
    />
  }
</p-dialog>
