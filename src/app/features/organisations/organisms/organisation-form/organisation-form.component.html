<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <app-form-field label="Nom" inputId="organisation-name" [error]="nameError()">
    <input
      pInputText
      id="organisation-name"
      formControlName="name"
      autocomplete="off"
      [invalid]="nameError() !== null"
      [attr.aria-invalid]="nameError() !== null"
      [attr.aria-describedby]="nameError() ? 'organisation-name-error' : null"
    />
  </app-form-field>

  <app-form-field
    label="Description"
    inputId="organisation-description"
    [optional]="true"
    [error]="descriptionError()"
    [hint]="descriptionLength() + ' / ' + descriptionMax + ' caractères'"
  >
    <textarea
      pTextarea
      id="organisation-description"
      formControlName="description"
      rows="4"
      [invalid]="descriptionError() !== null"
      [attr.aria-invalid]="descriptionError() !== null"
      [attr.aria-describedby]="
        descriptionError() ? 'organisation-description-error' : 'organisation-description-hint'
      "
    ></textarea>
  </app-form-field>

  <div class="organisation-form__actions">
    <button pButton type="button" severity="secondary" text (click)="cancelled.emit()">
      Annuler
    </button>
    <button pButton type="submit" [disabled]="!canSubmit()" [loading]="saving()">
      {{ submitLabel() }}
    </button>
  </div>
</form>
