@if (loaded() && !loading() && totalRecords() === 0) {
  <app-empty-state
    message="Aucun athlète pour l'instant"
    detail="Les athlètes apparaissent ici dès qu'un coach de l'organisation les suit."
  />
} @else {
  <p-table
    [value]="loaded() ? athletes() : []"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [paginator]="totalRecords() > rows()"
    [first]="first()"
    [rows]="rows()"
    [totalRecords]="totalRecords()"
    [loading]="loading() && loaded()"
    [showLoader]="false"
    dataKey="athleteId"
    (onLazyLoad)="onLazyLoad($event)"
  >
    <ng-template #header>
      <tr>
        <th scope="col">Nom</th>
        <th scope="col">Coachs référents</th>
      </tr>
    </ng-template>

    <ng-template #body let-athlete>
      <tr>
        <td>{{ athlete.firstName }} {{ athlete.lastName }}</td>
        <td>{{ coachNames(athlete) }}</td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      @for (row of skeletonRows; track row) {
        <tr aria-hidden="true">
          <td><p-skeleton width="10rem" /></td>
          <td><p-skeleton width="14rem" /></td>
        </tr>
      }
    </ng-template>
  </p-table>
}
