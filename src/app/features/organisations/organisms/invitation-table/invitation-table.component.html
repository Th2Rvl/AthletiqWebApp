@if (loaded() && !loading() && totalRecords() === 0) {
  <app-empty-state
    message="Aucune invitation en attente"
    actionLabel="Inviter un coach"
    (action)="invite.emit()"
  />
} @else {
  <p-table
    [value]="loaded() ? invitations() : []"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [paginator]="totalRecords() > rows()"
    [first]="first()"
    [rows]="rows()"
    [totalRecords]="totalRecords()"
    [loading]="loading() && loaded()"
    [showLoader]="false"
    dataKey="id"
    (onLazyLoad)="onLazyLoad($event)"
  >
    <ng-template #header>
      <tr>
        <th scope="col">E-mail</th>
        <th scope="col">Statut</th>
        <th scope="col">Envoyée le</th>
        <th scope="col"><span class="visually-hidden">Actions</span></th>
      </tr>
    </ng-template>

    <ng-template #body let-invitation>
      <tr>
        <td>{{ invitation.email }}</td>
        <td>
          @let status = statusOf(invitation);
          <p-tag [value]="status.label" [severity]="status.severity" />
        </td>
        <td>{{ invitation.createdAt | date: 'd MMM y' }}</td>
        <td class="actions-cell">
          @if (invitation.status === 'PENDING') {
            <button
              pButton
              type="button"
              size="small"
              severity="danger"
              text
              [attr.aria-label]="'Annuler l\'invitation de ' + invitation.email"
              (click)="cancel.emit(invitation)"
            >
              Annuler l'invitation
            </button>
          }
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      @for (row of skeletonRows; track row) {
        <tr aria-hidden="true">
          <td><p-skeleton width="14rem" /></td>
          <td><p-skeleton width="5rem" /></td>
          <td><p-skeleton width="6rem" /></td>
          <td><p-skeleton width="8rem" /></td>
        </tr>
      }
    </ng-template>
  </p-table>
}
