@if (loaded() && !loading() && totalRecords() === 0) {
  <app-empty-state
    message="Aucun coach dans cette organisation"
    actionLabel="Inviter un coach"
    (action)="invite.emit()"
  />
} @else {
  <p-table
    [value]="loaded() ? coaches() : []"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [paginator]="totalRecords() > rows()"
    [first]="first()"
    [rows]="rows()"
    [totalRecords]="totalRecords()"
    [loading]="loading() && loaded()"
    [showLoader]="false"
    dataKey="coachId"
    (onLazyLoad)="onLazyLoad($event)"
  >
    <ng-template #header>
      <tr>
        <th scope="col">Nom</th>
        <th scope="col">E-mail</th>
        <th scope="col">Rattaché le</th>
        <th scope="col"><span class="visually-hidden">Actions</span></th>
      </tr>
    </ng-template>

    <ng-template #body let-coach>
      <tr>
        <td>{{ coach.firstName }} {{ coach.lastName }}</td>
        <td>{{ coach.email }}</td>
        <td>{{ coach.joinedAt | date: 'd MMM y' }}</td>
        <td class="actions-cell">
          <button
            pButton
            type="button"
            size="small"
            severity="danger"
            text
            [attr.aria-label]="'Retirer ' + coach.firstName + ' ' + coach.lastName"
            (click)="remove.emit(coach)"
          >
            Retirer
          </button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      @for (row of skeletonRows; track row) {
        <tr aria-hidden="true">
          <td><p-skeleton width="10rem" /></td>
          <td><p-skeleton width="14rem" /></td>
          <td><p-skeleton width="6rem" /></td>
          <td><p-skeleton width="4rem" /></td>
        </tr>
      }
    </ng-template>
  </p-table>
}
