<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="signup-form__names">
    <app-form-field label="Prénom" inputId="signup-first-name">
      <input pInputText id="signup-first-name" formControlName="firstName" autocomplete="given-name" />
    </app-form-field>

    <app-form-field label="Nom" inputId="signup-last-name">
      <input pInputText id="signup-last-name" formControlName="lastName" autocomplete="family-name" />
    </app-form-field>
  </div>

  <app-form-field label="E-mail" inputId="signup-email">
    <input pInputText id="signup-email" type="email" formControlName="email" autocomplete="email" />
  </app-form-field>

  <app-form-field
    label="Mot de passe"
    inputId="signup-password"
    hint="Au moins 12 caractères, une lettre et un chiffre."
  >
    <input
      pInputText
      id="signup-password"
      type="password"
      formControlName="password"
      autocomplete="new-password"
    />
  </app-form-field>

  <app-form-field
    label="Confirmation du mot de passe"
    inputId="signup-password-confirmation"
    [error]="
      form.controls.passwordConfirmation.touched && form.controls.passwordConfirmation.hasError('mismatch')
        ? 'Les deux mots de passe ne correspondent pas'
        : null
    "
  >
    <input
      pInputText
      id="signup-password-confirmation"
      type="password"
      formControlName="passwordConfirmation"
      autocomplete="new-password"
    />
  </app-form-field>

  @if (error(); as message) {
    <p-message severity="error" role="alert">{{ message }}</p-message>
  }

  <button pButton type="submit" [disabled]="!canSubmit()" [loading]="submitting()">
    Créer mon compte
  </button>
</form>
