<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <app-form-field
    label="Nouveau mot de passe"
    inputId="reset-password"
    hint="Au moins 12 caractères, une lettre et un chiffre."
  >
    <input pInputText id="reset-password" type="password" formControlName="password" autocomplete="new-password" />
  </app-form-field>

  <app-form-field
    label="Confirmation du nouveau mot de passe"
    inputId="reset-password-confirmation"
    [error]="
      form.controls.passwordConfirmation.touched && form.controls.passwordConfirmation.hasError('mismatch')
        ? 'Les deux mots de passe ne correspondent pas'
        : null
    "
  >
    <input
      pInputText
      id="reset-password-confirmation"
      type="password"
      formControlName="passwordConfirmation"
      autocomplete="new-password"
    />
  </app-form-field>

  @if (error(); as message) {
    <p-message severity="error" role="alert">{{ message }}</p-message>
  }

  <button pButton type="submit" [disabled]="!canSubmit()" [loading]="submitting()">
    Enregistrer le nouveau mot de passe
  </button>
</form>
