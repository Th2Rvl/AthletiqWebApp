<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <app-form-field label="E-mail" inputId="forgot-email">
    <input pInputText id="forgot-email" type="email" formControlName="email" autocomplete="email" />
  </app-form-field>

  @if (error(); as message) {
    <p-message severity="error" role="alert">{{ message }}</p-message>
  }

  <button pButton type="submit" [disabled]="!canSubmit()" [loading]="submitting()">
    Envoyer le lien de réinitialisation
  </button>
</form>
