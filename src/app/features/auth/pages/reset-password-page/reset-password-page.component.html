<main class="account">
  <div class="account__panel">
    <p class="account__brand">Athletiq</p>
    <h1 class="account__title">Nouveau mot de passe</h1>

    @if (done()) {
      <p-message severity="success" role="status">
        Mot de passe enregistré. Vous pouvez vous connecter.
      </p-message>
      <button pButton type="button" (click)="goToLogin()">Se connecter</button>
    } @else {
      <app-reset-password-form
        [submitting]="submitting()"
        [error]="error()"
        (submitted)="reset($event)"
      />
    }
  </div>
</main>
