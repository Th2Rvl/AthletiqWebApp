<main class="account">
  <div class="account__panel">
    <p class="account__brand">Athletiq</p>
    <h1 class="account__title">Mot de passe oublié</h1>

    @if (message(); as text) {
      <p-message severity="success" role="status">{{ text }}</p-message>

      @if (resetToken(); as token) {
        <p class="account__note">
          Aucun service d'e-mail n'est encore en place : utilisez ce lien pour choisir un nouveau
          mot de passe.
        </p>
        <button pButton type="button" (click)="goToReset()">Choisir un nouveau mot de passe</button>
      }
    } @else {
      <app-forgot-password-form
        [submitting]="submitting()"
        [error]="error()"
        (submitted)="requestReset($event)"
      />
    }

    <p class="account__aside">
      <a routerLink="/login">Revenir à la connexion</a>
    </p>
  </div>
</main>
