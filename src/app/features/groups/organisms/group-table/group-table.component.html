@if (noGroupAtAll()) {
  <app-empty-state
    message="Aucun groupe pour l'instant"
    detail="Un groupe réunit des athlètes que vous planifiez ensemble."
    actionLabel="Créer un groupe"
    (action)="create.emit()"
  />
} @else {
  <div class="group-table__toolbar">
    <button pButton type="button" (click)="create.emit()">Créer un groupe</button>
  </div>

  <p-table
    [value]="loaded() ? groups() : []"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [paginator]="totalRecords() > rows()"
    [first]="first()"
    [rows]="rows()"
    [totalRecords]="totalRecords()"
    [loading]="loading() && loaded()"
    [showLoader]="false"
    dataKey="id"
    (onLazyLoad)="onLazyLoad($event)"
  >
    <ng-template #header>
      <tr>
        <th scope="col">Nom</th>
        <th scope="col" class="numeric">Athlètes</th>
        <th scope="col">Créé le</th>
        <th scope="col"><span class="visually-hidden">Actions</span></th>
      </tr>
    </ng-template>

    <ng-template #body let-group>
      <tr>
        <td>
          <a class="group-table__name" [routerLink]="['/groupes', group.id]">{{ group.name }}</a>
        </td>
        <td class="numeric">{{ group.athleteCount }}</td>
        <td>{{ group.createdAt | date: 'd MMM y' }}</td>
        <td class="group-table__actions">
          <button
            pButton
            type="button"
            size="small"
            severity="secondary"
            text
            [attr.aria-label]="'Renommer ' + group.name"
            (click)="rename.emit(group)"
          >
            Renommer
          </button>
          <button
            pButton
            type="button"
            size="small"
            severity="danger"
            text
            [attr.aria-label]="'Supprimer ' + group.name"
            (click)="remove.emit(group)"
          >
            Supprimer
          </button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      @for (row of skeletonRows; track row) {
        <tr aria-hidden="true">
          <td><p-skeleton width="10rem" /></td>
          <td><p-skeleton width="2rem" /></td>
          <td><p-skeleton width="6rem" /></td>
          <td><p-skeleton width="10rem" /></td>
        </tr>
      }
    </ng-template>
  </p-table>
}
