<app-page-header title="Groupes">
  <app-section-tabs label="Athlètes et groupes" [tabs]="sectionTabs" />
  <button pButton type="button" (click)="openCreate()">
    <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
    Créer un groupe
  </button>
</app-page-header>

@if (list.error() && !list.loading()) {
  <app-error-state [message]="errorMessage()" (retry)="list.reload()" />
} @else {
  <app-group-table
    [groups]="list.items()"
    [totalRecords]="list.total()"
    [loading]="list.loading()"
    [loaded]="list.loaded()"
    [first]="list.first()"
    [rows]="list.rows()"
    (pageChange)="onPage($event)"
    (create)="openCreate()"
    (rename)="openRename($event)"
    (remove)="confirmRemove($event)"
  />
}

<p-dialog
  [header]="editing() ? 'Renommer le groupe' : 'Créer un groupe'"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: 'min(30rem, 100vw)' }"
>
  @if (dialogVisible()) {
    <app-group-form
      [group]="editing()"
      [saving]="saving()"
      [serverErrors]="serverErrors()"
      (submitted)="save($event)"
      (cancelled)="closeDialog()"
    />
  }
</p-dialog>
