<h1 class="page-title">Exercices</h1>

@if (exercises.error() && !exercises.loading()) {
  <app-error-state [message]="errorMessage()" (retry)="exercises.reload()" />
} @else {
  <app-exercise-table
    [exercises]="exercises.items()"
    [totalRecords]="exercises.total()"
    [loading]="exercises.loading()"
    [loaded]="exercises.loaded()"
    [first]="exercises.first()"
    [rows]="exercises.rows()"
    [query]="query()"
    [muscleGroup]="muscleGroup()"
    [equipment]="equipment()"
    (pageChange)="onPage($event)"
    (queryChange)="onQueryChange($event)"
    (muscleGroupChange)="onMuscleGroupChange($event)"
    (equipmentChange)="onEquipmentChange($event)"
    (create)="openCreate()"
    (edit)="openEdit($event)"
    (remove)="confirmRemove($event)"
  />
}

<p-dialog
  [header]="editing() ? 'Modifier l’exercice' : 'Créer un exercice'"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: 'min(36rem, 100vw)' }"
>
  @if (dialogVisible()) {
    <app-exercise-form
      [exercise]="editing()"
      [saving]="saving()"
      [serverErrors]="serverErrors()"
      (submitted)="save($event)"
      (cancelled)="closeDialog()"
    />
  }
</p-dialog>
